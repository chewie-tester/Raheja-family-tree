<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree: data check</title>
<style>
  :root { --bg:#fafaf8; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#dedcd5;
          --err:#b3261e; --warn:#a15c00; --gap:#2f5fa8; --info:#5f6b5f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1a18; --fg:#ecebe6; --muted:#a3a29b; --card:#242421; --line:#3a3a35;
          --err:#f2918a; --warn:#e8b25c; --gap:#8db4f0; --info:#a9b5a9; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:1rem; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; max-width:1000px; margin-inline:auto; }
  h1 { font-size:1.3rem; margin:.2rem 0 .8rem; }
  h2 { font-size:1.05rem; margin:1.4rem 0 .4rem; }
  .bar { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-bottom:.6rem; }
  button, label.btn { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:.45rem .8rem; font:inherit; cursor:pointer; }
  input[type=file] { display:none; }
  #status { color:var(--muted); margin:.3rem 0; }
  #status.bad { color:var(--err); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:.5rem; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:.5rem .7rem; }
  .stat b { display:block; font-size:1.3rem; }
  .stat span { color:var(--muted); font-size:.8rem; }
  .stat.error b { color:var(--err); } .stat.warning b { color:var(--warn); } .stat.gap b { color:var(--gap); }
  details { background:var(--card); border:1px solid var(--line); border-radius:8px; margin:.4rem 0; }
  summary { padding:.5rem .8rem; cursor:pointer; font-weight:600; }
  summary small { color:var(--muted); font-weight:400; }
  .tablewrap { overflow-x:auto; padding:0 .8rem .6rem; }
  table { border-collapse:collapse; width:100%; font-size:.88rem; }
  td, th { text-align:left; padding:.25rem .5rem .25rem 0; border-top:1px solid var(--line); vertical-align:top; }
  td.ref { white-space:nowrap; font-family:ui-monospace, monospace; }
  .lvl-error > summary { color:var(--err); } .lvl-warning > summary { color:var(--warn); }
  .lvl-gap > summary { color:var(--gap); } .lvl-info > summary { color:var(--info); }
  .none { color:var(--muted); padding:.2rem 0; }
</style>
</head>
<body>
<h1>Family Tree: data check (Phase 1)</h1>
<div class="bar">
  <button id="reload">Load from Google Sheet</button>
  <label class="btn">Choose file(s)…<input id="file" type="file" multiple accept=".xlsx,.xls,.csv"></label>
</div>
<div id="status">Starting…</div>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="loader.js"></script>
<script src="indexer.js"></script>
<script src="validate.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const LEVELS = [["error","Errors","Data is broken"], ["warning","Warnings","Probably wrong, worth a look"],
                ["gap","Gaps","Information missing in the source (kept as gaps)"], ["info","Info","For reference"]];

function status(msg, bad) { const s = $("status"); s.textContent = msg; s.className = bad ? "bad" : ""; }

async function run(loader) {
  status("Loading…"); $("out").innerHTML = "";
  try {
    const { people, unions, source } = await loader();
    const idx = buildIndex(people, unions);
    const report = validate(idx);
    window.familyIndex = idx;      // kept for the tree view in Phase 2
    window.familyReport = report;
    render(report);
    status(`Loaded ${report.stats.people} people and ${report.stats.unions} unions from ${source}. Read-only: nothing was changed.`);
  } catch (e) {
    status(e.message || String(e), true);
  }
}

function render({ findings, counts, stats, gens }) {
  const stat = (n, label, cls = "") => `<div class="stat ${cls}"><b>${n}</b><span>${esc(label)}</span></div>`;
  let h = `<h2>Summary</h2><div class="stats">
    ${stat(stats.people, "People")}${stat(stats.unions, "Unions")}${stat(stats.lineage, "Lineage")}
    ${stat(stats.spouse, "Married-in spouses")}${stat(stats.roots, "Lineage roots")}
    ${stat(counts.error, "Errors", "error")}${stat(counts.warning, "Warnings", "warning")}${stat(counts.gap, "Gaps", "gap")}</div>
    <div class="none">By generation: ${Object.keys(gens).sort().map((g) => `${esc(g)}: ${gens[g]}`).join(" · ")}</div>`;
  for (const [level, title, blurb] of LEVELS) {
    const items = findings.filter((f) => f.level === level);
    h += `<h2>${title} (${items.length}) <small style="font-weight:400;color:var(--muted)">${blurb}</small></h2>`;
    if (!items.length) { h += `<div class="none">None found.</div>`; continue; }
    const groups = {};
    for (const f of items) (groups[f.code] ||= []).push(f);
    for (const code of Object.keys(groups)) {
      const g = groups[code];
      h += `<details class="lvl-${level}" ${level === "error" || level === "warning" ? "open" : ""}>
        <summary>${esc(code)} <small>(${g.length})</small></summary><div class="tablewrap"><table>
        ${g.map((f) => `<tr><td class="ref">${esc(f.ref)}</td><td>${esc(f.name)}</td><td>${esc(f.message)}</td></tr>`).join("")}
        </table></div></details>`;
    }
  }
  $("out").innerHTML = h;
}

$("reload").onclick = () => run(Loader.loadFromSheet);
$("file").onchange = (e) => e.target.files.length && run(() => Loader.loadFromFiles([...e.target.files]));
run(Loader.loadFromSheet);
</script>
</body>
</html>
